# 中间件统一编排（MySQL / Redis / RabbitMQ）——Go 服务本身仍跑宿主机（go run），见 PLAN-docker.md
# 变量插值默认读同目录 .env（与 godotenv 同一文件双用）：DB_USER/DB_PASSWORD 即 go 服务连接凭证，一处配置两边生效
# 端口避让本机服务：本机 dmg MySQL 占 3306、brew redis@6.2 占 6379，容器用 3307/6380 并存
services:
  mysql:
    image: mysql:8.0
    container_name: handicap-mysql
    restart: unless-stopped
    # utf8mb4_0900_ai_ci 与 README 建库语句一致（8.0 默认即是，显式声明防漂移）
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    environment:
      # root 密码复用 DB_PASSWORD：学习项目取舍，不为此引入新键（见 PLAN-docker.md）
      # 密码用 :? 语法强制必填——缺失/为空即报错退出，无内置默认值，真实密码只存在于 .env（不进 git）
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:?请在项目根 .env 设置 DB_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME:-handicap_db}
      MYSQL_USER: ${DB_USER:-app_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:?请在项目根 .env 设置 DB_PASSWORD}
      TZ: Asia/Shanghai # 对齐 Go 侧 Loc: time.Local 的 DATETIME 语义
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1"]
      interval: 5s
      timeout: 3s
      retries: 12

  redis:
    image: redis:6.2 # 对齐本机 brew redis@6.2 版本，减少变量
    container_name: handicap-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"] # AOF：容器重启后鉴权白名单 token 不丢
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  rabbitmq:
    image: rabbitmq:3-management # 管理台 :15672 guest/guest
    container_name: rabbitmq
    restart: unless-stopped
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 30 # 冷启动（节点 + management 插件初始化 >2 分钟）不够 12 次会误判 unhealthy

volumes:
  mysql_data:
  redis_data:
  rabbitmq_data:
