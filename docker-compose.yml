# 中间件 + Go 服务统一编排——server/consumer 不挂 profile，up 即全栈，见 plans/PLAN-docker.md
#   docker compose up -d --build  → 全栈（中间件 + server + consumer）
#   server 不映射宿主机端口：前端容器 GoProject-web 经 compose 网络直连 gyz-server:8080，
#   宿主机 8080 永远留给 go run——容器化全栈与宿主机开发流并存零冲突
# 变量插值默认读同目录 .env（与 godotenv 同一文件双用）：DB_USER/DB_PASSWORD 即 go 服务连接凭证，一处配置两边生效
# 端口避让本机服务：本机 dmg MySQL 占 3306、brew redis@6.2 占 6379，容器用 3307/6380 并存
services:
  mysql:
    image: mysql:8.0
    container_name: gyz-mysql
    restart: unless-stopped
    # utf8mb4_0900_ai_ci 与 README 建库语句一致（8.0 默认即是，显式声明防漂移）
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    environment:
      # root 密码复用 DB_PASSWORD：学习项目取舍，不为此引入新键（见 plans/PLAN-docker.md）
      # 密码用 :? 语法强制必填——缺失/为空即报错退出，无内置默认值，真实密码只存在于 .env（不进 git）
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:?请在项目根 .env 设置 DB_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME:-gyz_db}
      MYSQL_USER: ${DB_USER:-app_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:?请在项目根 .env 设置 DB_PASSWORD}
      TZ: Asia/Shanghai # 对齐 Go 侧 Loc: time.Local 的 DATETIME 语义
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1"]
      interval: 5s
      timeout: 3s
      retries: 12

  redis:
    image: redis:6.2 # 对齐本机 brew redis@6.2 版本，减少变量
    container_name: gyz-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"] # AOF：容器重启后鉴权白名单 token 不丢
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  rabbitmq:
    image: rabbitmq:3-management # 管理台 :15672 guest/guest
    container_name: rabbitmq
    restart: unless-stopped
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 15s # rabbitmq-diagnostics 是 erlang 脚本，VM 资源紧张时冷执行 >5s（实测踩坑，5s 曾致 depends_on 误判 unhealthy）
      retries: 30 # 冷启动（节点 + management 插件初始化 >2 分钟）不够 12 次会误判 unhealthy

  # ==================== Go 服务容器化 ====================
  # 单镜像双二进制（Dockerfile 一个 builder 产出 /app/server 与 /app/consumer），
  # consumer 用 command 覆盖启动另一个，避免双镜像版本漂移（决策见 plans/PLAN-docker.md）
  server:
    build:
      context: .
      args:
        # 弱网可在 .env 覆盖：GO_IMAGE=docker.m.daocloud.io/library/golang:1.24-alpine（RUNTIME_IMAGE/GOPROXY 同法）
        GO_IMAGE: ${GO_IMAGE:-golang:1.24-alpine}
        RUNTIME_IMAGE: ${RUNTIME_IMAGE:-alpine:3.21}
        GOPROXY: ${GOPROXY:-https://goproxy.cn,direct}
    # APP_TAG 仅由 deploy.sh 发版时注入（APP_TAG=x.y.z up -d --no-build）；手动命令勿带，
    # 否则 up -d --build 会打出该版本 tag 却走无 GIT_REV 的构建路径，污染版本历史（决策见 PLAN-docker.md）
    image: gyz-server:${APP_TAG:-latest}
    container_name: gyz-server
    restart: unless-stopped
    environment:
      # 容器网络内直连服务名；端口是容器内端口（3306/6379/5672），不是宿主机映射端口 3307/6380
      DB_HOST: mysql
      DB_PORT: "3306"
      REDIS_ADDR: redis:6379
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
      # 凭证/密钥：沿用 .env 插值，:? 语法强制必填（对齐 mysql 服务既有约定，不进镜像层）
      DB_USER: ${DB_USER:-app_user}
      DB_PASSWORD: ${DB_PASSWORD:?请在项目根 .env 设置 DB_PASSWORD}
      DB_NAME: ${DB_NAME:-gyz_db}
      JWT_SECRET: ${JWT_SECRET:?请在项目根 .env 设置 JWT_SECRET}
      JWT_TTL_HOURS: ${JWT_TTL_HOURS:-24}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      GIN_MODE: release # gin 读 GIN_MODE 关 [GIN-debug] 输出（Logger/Recovery 中间件保留）
      TZ: Asia/Shanghai # 对齐 DSN Loc: time.Local 与 mysql 容器时区，防 DATETIME 偏 8h
    # 无宿主机端口映射：前端容器 GoProject-web 经 goproject_default 网络直连
    # gyz-server:8080（容器名 + 容器内端口）；宿主机 8080 永远留给 go run（并存零冲突），
    # 浏览器 Swagger/接口文档改走前端 nginx 的 /swagger 反代入口
    depends_on:
      mysql: { condition: service_healthy }
      redis: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
    healthcheck:
      # 只探进程不 ping 依赖：中间件挂了重启 server 容器无意义且中断在途请求（理由见 PLAN-docker.md）
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8080/health"]
      interval: 5s # 对齐前端发版脚本的健康门禁节奏：最坏 unhealthy 判定 = 30+5*6=60s，落在 120s 门禁预算内
      timeout: 3s
      retries: 6
      start_period: 30s # 首启含 Migrate+Seed，留缓冲
    stop_grace_period: 15s # > main.go Shutdown 超时(10s)，优雅退出日志打完再 SIGKILL

  consumer:
    build: # 与 server 同 build 同 tag：第二次全命中层缓存，秒级
      context: .
      args:
        GO_IMAGE: ${GO_IMAGE:-golang:1.24-alpine}
        RUNTIME_IMAGE: ${RUNTIME_IMAGE:-alpine:3.21}
        GOPROXY: ${GOPROXY:-https://goproxy.cn,direct}
    image: gyz-server:${APP_TAG:-latest} # 与 server 同 tag：deploy.sh 切换时 APP_TAG 一条 up 同步双服务
    container_name: gyz-consumer
    command: ["/app/consumer"] # 唯一差异：起另一个二进制
    restart: unless-stopped
    environment:
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_USER: ${DB_USER:-app_user}
      DB_PASSWORD: ${DB_PASSWORD:?请在项目根 .env 设置 DB_PASSWORD}
      DB_NAME: ${DB_NAME:-gyz_db}
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
      LOG_LEVEL: ${LOG_LEVEL:-info}
      TZ: Asia/Shanghai
      # 不设 REDIS_ADDR/JWT_SECRET：consumer 不连 Redis、不验 JWT（cmd/consumer/main.go service.New 传零值）
    depends_on:
      mysql: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
    # 不设 healthcheck：无端口无业务探针，唯一进程即 PID 1——进程退出容器即退出，restart 负责拉起
    stop_grace_period: 15s # 三队列在途消息手动 ack 排空的时间窗

volumes:
  mysql_data:
  redis_data:
  rabbitmq_data:
