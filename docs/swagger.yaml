basePath: /api/v1
definitions:
  model.ActionResp:
    properties:
      code:
        example: 200
        type: integer
      data:
        description: 恒为 null
      msg:
        example: 编辑成功
        type: string
    type: object
  model.Diagnose:
    properties:
      buy_num:
        type: integer
      buy_price:
        type: number
      id:
        type: integer
      remark:
        type: string
      report_content:
        type: string
      report_submit_time:
        description: NULL→""
        type: string
      status:
        type: integer
      stock_code:
        type: string
      stock_name:
        type: string
      submit_time:
        type: string
      teacher_name:
        type: string
      user_name:
        type: string
      user_nick_name:
        type: string
    type: object
  model.DiagnoseAuditLog:
    properties:
      operator:
        type: string
      remark:
        type: string
      result:
        type: string
      time:
        type: string
      type:
        type: string
    type: object
  model.DiagnoseAuditReq:
    properties:
      audit_type:
        type: string
      id:
        type: integer
      reject_reason:
        type: string
      result:
        description: pass / reject
        type: string
    type: object
  model.DiagnoseDetail:
    properties:
      audit_logs:
        items:
          $ref: '#/definitions/model.DiagnoseAuditLog'
        type: array
      buy_num:
        type: integer
      buy_price:
        type: number
      id:
        type: integer
      remark:
        type: string
      report_content:
        type: string
      report_submit_time:
        description: NULL→""
        type: string
      status:
        type: integer
      stock_code:
        type: string
      stock_name:
        type: string
      submit_time:
        type: string
      teacher_name:
        type: string
      user_name:
        type: string
      user_nick_name:
        type: string
    type: object
  model.DiagnoseDetailResp:
    properties:
      code:
        example: 200
        type: integer
      data:
        $ref: '#/definitions/model.DiagnoseDetail'
      msg:
        example: success
        type: string
    type: object
  model.DiagnoseListResp:
    properties:
      code:
        example: 200
        type: integer
      data:
        properties:
          count:
            example: 15
            type: integer
          list:
            items:
              $ref: '#/definitions/model.Diagnose'
            type: array
        type: object
      msg:
        example: success
        type: string
    type: object
  model.DiagnoseSubmitReportReq:
    properties:
      id:
        type: integer
      report_content:
        description: 富文本 HTML
        type: string
    type: object
  model.GetInfoResp:
    properties:
      code:
        example: 200
        type: integer
      data:
        $ref: '#/definitions/model.UserInfo'
      msg:
        example: success
        type: string
    type: object
  model.LoginReq:
    properties:
      password:
        example: admin123
        type: string
      username:
        example: admin
        type: string
    required:
    - password
    - username
    type: object
  model.LoginResp:
    properties:
      code:
        example: 200
        type: integer
      data:
        description: 恒为 null
      expire:
        description: JWT exp（Unix 秒）
        example: 1724054400
        type: integer
      msg:
        example: 登录成功
        type: string
      passwd_expired:
        description: 密码是否过期（暂恒 false）
        example: false
        type: boolean
      token:
        example: eyJhbGciOiJIUzI1NiIs...
        type: string
    type: object
  model.Resign:
    properties:
      created_at:
        type: string
      group_count:
        description: 原老师绑定业务员数（一业务员一群，后端计算）
        type: integer
      id:
        type: integer
      operator:
        type: string
      original_teacher_dept:
        type: string
      original_teacher_dept_id:
        type: integer
      original_teacher_id:
        type: integer
      original_teacher_name:
        type: string
      replace_teacher_dept:
        type: string
      replace_teacher_id:
        type: integer
      replace_teacher_name:
        type: string
      salesman_dept:
        type: string
      salesman_name:
        type: string
      transfer_content:
        type: string
      transfer_time:
        type: string
      updated_at:
        type: string
    type: object
  model.ResignAddReq:
    properties:
      original_teacher_id:
        type: integer
      replace_teacher_id:
        type: integer
      transfer_content:
        description: 自由文本，≤200 字符
        type: string
    type: object
  model.ResignListReq:
    properties:
      dept_id:
        description: 精确，匹配 original_teacher_dept_id 快照，''/null/缺省不过滤
        type: integer
      original_teacher:
        description: 模糊，匹配 original_teacher_name
        type: string
      page_index:
        description: 默认 1（service 层兜底）
        type: integer
      page_size:
        description: 默认 10，上限 100
        type: integer
      replace_teacher:
        description: 模糊，匹配 replace_teacher_name
        type: string
      salesman:
        description: 模糊，匹配 salesman_name
        type: string
      transfer_begin_time:
        description: yyyy-MM-dd，与 EndTime 成对生效
        type: string
      transfer_end_time:
        type: string
    type: object
  model.ResignListResp:
    properties:
      code:
        example: 200
        type: integer
      data:
        properties:
          count:
            example: 7
            type: integer
          list:
            items:
              $ref: '#/definitions/model.Resign'
            type: array
        type: object
      msg:
        example: success
        type: string
    type: object
  model.Teacher:
    properties:
      account:
        type: string
      avatar:
        type: string
      bind_sales_count:
        description: 相关子查询带出，不落列
        type: integer
      created_at:
        type: string
      dept_id:
        type: integer
      dept_name:
        type: string
      id:
        type: integer
      name:
        type: string
      nickname:
        type: string
      phone:
        type: string
      qualification:
        type: string
      rating:
        description: 种子 1-5，编辑后 0/1/2
        type: integer
      signature:
        type: string
      status:
        description: 输出 "1"/"0"
        type: string
      title:
        type: string
      update_by:
        type: string
      updated_at:
        type: string
      work_no:
        type: string
    type: object
  model.TeacherBindReq:
    properties:
      id:
        description: 老师表 id（接口键名 id，内部字段语义仍为 teacher_id）
        type: integer
      user_ids:
        description: 追加语义，仅新增绑定
        items:
          type: integer
        type: array
    type: object
  model.TeacherBoundResp:
    properties:
      code:
        example: 200
        type: integer
      data:
        example:
        - 1
        items:
          type: integer
        type: array
      msg:
        example: success
        type: string
    type: object
  model.TeacherDetail:
    properties:
      avatar:
        type: string
      id:
        type: integer
      level:
        description: 0 无 / 3 初级 / 5 高级
        type: integer
      nickname:
        type: string
      sign:
        type: string
      title:
        type: string
    type: object
  model.TeacherDetailResp:
    properties:
      code:
        example: 200
        type: integer
      data:
        $ref: '#/definitions/model.TeacherDetail'
      msg:
        example: success
        type: string
    type: object
  model.TeacherListReq:
    properties:
      account:
        description: 模糊
        type: string
      bind_sales_count:
        description: 精确，未填不过滤；0 是有效过滤值
        type: integer
      dept_id:
        description: 精确，null/""/缺省不过滤
        type: integer
      id:
        description: 精确，null/""/缺省不过滤
        type: integer
      name:
        description: 模糊
        type: string
      nickname:
        description: 模糊
        type: string
      page_index:
        description: 默认 1（service 层兜底）
        type: integer
      page_size:
        description: 默认 10，上限 100
        type: integer
      qualification:
        description: 精确（中文）
        type: string
      status:
        description: -1 全部不过滤 / 1 启用 / 0 停用
        type: integer
      title:
        description: 模糊
        type: string
      update_begin_time:
        description: yyyy-MM-dd，与 EndTime 成对生效
        type: string
      update_by:
        description: 模糊
        type: string
      update_end_time:
        type: string
    type: object
  model.TeacherListResp:
    properties:
      code:
        example: 200
        type: integer
      data:
        properties:
          count:
            example: 42
            type: integer
          list:
            items:
              $ref: '#/definitions/model.Teacher'
            type: array
        type: object
      msg:
        example: success
        type: string
    type: object
  model.TeacherOption:
    properties:
      dept_name:
        type: string
      id:
        type: integer
      name:
        type: string
    type: object
  model.TeacherOptionsResp:
    properties:
      code:
        example: 200
        type: integer
      data:
        items:
          $ref: '#/definitions/model.TeacherOption'
        type: array
      msg:
        example: success
        type: string
    type: object
  model.TeacherSalesListResp:
    properties:
      code:
        example: 200
        type: integer
      data:
        properties:
          count:
            example: 3
            type: integer
          list:
            items:
              $ref: '#/definitions/model.TeacherSalesRow'
            type: array
          pageIndex:
            example: 1
            type: integer
          pageSize:
            example: 5
            type: integer
        type: object
      msg:
        example: success
        type: string
    type: object
  model.TeacherSalesRow:
    properties:
      bind_time:
        type: string
      dept_name:
        type: string
      id:
        type: integer
      nickname:
        type: string
      username:
        type: string
    type: object
  model.TeacherUpdateReq:
    properties:
      avatar:
        type: string
      id:
        type: integer
      level:
        description: 0 无 / 3 初级 / 5 高级（前端 editForm 下拉取值）
        type: integer
      sign:
        type: string
      title:
        type: string
    type: object
  model.UserInfo:
    properties:
      avatar:
        example: ""
        type: string
      introduction:
        example: ""
        type: string
      name:
        example: 系统管理员
        type: string
      permissions:
        example:
        - '*:*:*'
        items:
          type: string
        type: array
      roles:
        example:
        - admin
        items:
          type: string
        type: array
    type: object
  response.Response:
    properties:
      code:
        type: integer
      data: {}
      msg:
        type: string
    type: object
info:
  contact: {}
  description: |-
    chatSys（老师管理/绑定业务员/离职转移）+ 诊股记录接口。
    统一响应结构 {code, msg, data}；写操作 msg 为约定中文，查询类为 "success"。
    业务接口需 Bearer token（JWT + Redis 白名单，见 PLAN-auth.md）。
  title: im系统诊股 API
  version: "1.0"
paths:
  /dxsf/diagnose/audit:
    post:
      consumes:
      - application/json
      description: professional 专业审核（状态 2）/ compliance 合规审核（状态 4）；通过 → 3/6，驳回 → 5/4（驳回时
        reject_reason 必填，富文本 HTML）
      parameters:
      - description: 审核请求体
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/model.DiagnoseAuditReq'
      produces:
      - application/json
      responses:
        "200":
          description: msg 为「审核通过」或「已驳回」，data 恒为 null
          schema:
            $ref: '#/definitions/model.ActionResp'
        "400":
          description: 请求体非法 / audit_type 或 result 非法 / 驳回时原因必填 / 当前状态不允许审核
          schema:
            $ref: '#/definitions/response.Response'
        "404":
          description: 诊股记录不存在
          schema:
            $ref: '#/definitions/response.Response'
        "500":
          description: 服务器内部错误
          schema:
            $ref: '#/definitions/response.Response'
      security:
      - ApiKeyAuth: []
      summary: 审核诊股报告
      tags:
      - 诊股记录
  /dxsf/diagnose/detail:
    get:
      description: 诊股记录全字段 + 审核流程日志（audit_logs）
      parameters:
      - description: 诊股记录 ID
        in: query
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/model.DiagnoseDetailResp'
        "400":
          description: id 缺失或非整数
          schema:
            $ref: '#/definitions/response.Response'
        "404":
          description: 诊股记录不存在
          schema:
            $ref: '#/definitions/response.Response'
        "500":
          description: 服务器内部错误
          schema:
            $ref: '#/definitions/response.Response'
      security:
      - ApiKeyAuth: []
      summary: 诊股记录详情
      tags:
      - 诊股记录
  /dxsf/diagnose/list:
    get:
      consumes:
      - application/json
      description: 分页查询诊股记录，零值/未传筛选字段不参与过滤；昵称/姓名/股票代码/股票名/老师模糊匹配，ID/买入价/持仓数/状态精确匹配
      parameters:
      - description: 诊股记录 ID（精确）
        in: query
        name: id
        type: integer
      - description: 用户昵称（模糊）
        in: query
        name: user_nick_name
        type: string
      - description: 用户姓名（模糊）
        in: query
        name: user_name
        type: string
      - description: 股票代码（模糊）
        in: query
        name: stock_code
        type: string
      - description: 股票名称（模糊）
        in: query
        name: stock_name
        type: string
      - description: 买入价（精确，DECIMAL 等值匹配）
        in: query
        name: buy_price
        type: number
      - description: 持仓数（精确）
        in: query
        name: buy_num
        type: integer
      - description: 老师姓名（模糊）
        in: query
        name: teacher_name
        type: string
      - description: 状态（精确 1-6：1 待提交 2 待审核 3 已驳回 4 待合规 5 合规驳回 6 已通过）
        enum:
        - 1
        - 2
        - 3
        - 4
        - 5
        - 6
        in: query
        name: status
        type: integer
      - description: 提交时间起（yyyy-MM-dd，与 submit_end_time 成对生效，闭合区间）
        in: query
        name: submit_begin_time
        type: string
      - description: 提交时间止（yyyy-MM-dd）
        in: query
        name: submit_end_time
        type: string
      - description: 报告提交时间起（yyyy-MM-dd，与 report_end_time 成对生效）
        in: query
        name: report_begin_time
        type: string
      - description: 报告提交时间止（yyyy-MM-dd）
        in: query
        name: report_end_time
        type: string
      - description: 页码（默认 1）
        in: query
        name: page_index
        type: integer
      - description: 页大小（默认 10，上限 100）
        in: query
        name: page_size
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/model.DiagnoseListResp'
        "400":
          description: 数值参数格式错误 / status 越界（非 1-6）
          schema:
            $ref: '#/definitions/response.Response'
        "500":
          description: 服务器内部错误
          schema:
            $ref: '#/definitions/response.Response'
      security:
      - ApiKeyAuth: []
      summary: 诊股记录列表
      tags:
      - 诊股记录
  /dxsf/diagnose/submitReport:
    post:
      consumes:
      - application/json
      description: 状态 1/3/5 可提交（首次编写 / 重新提审），提交后状态统一回落 2；report_content 为富文本 HTML
      parameters:
      - description: 提交报告请求体
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/model.DiagnoseSubmitReportReq'
      produces:
      - application/json
      responses:
        "200":
          description: msg 固定「提交成功」，data 恒为 null
          schema:
            $ref: '#/definitions/model.ActionResp'
        "400":
          description: 请求体非法 / 报告内容为空 / 当前状态不允许提交
          schema:
            $ref: '#/definitions/response.Response'
        "404":
          description: 诊股记录不存在
          schema:
            $ref: '#/definitions/response.Response'
        "500":
          description: 服务器内部错误
          schema:
            $ref: '#/definitions/response.Response'
      security:
      - ApiKeyAuth: []
      summary: 提交诊股报告
      tags:
      - 诊股记录
  /dxsf/teacher/bind/salesman:
    post:
      consumes:
      - application/json
      description: 追加语义：仅新增绑定，已存在的绑定保持不变；重复绑定幂等
      parameters:
      - description: 绑定业务员请求体
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/model.TeacherBindReq'
      produces:
      - application/json
      responses:
        "200":
          description: msg 固定「绑定成功」，data 恒为 null
          schema:
            $ref: '#/definitions/model.ActionResp'
        "400":
          description: 请求体非法
          schema:
            $ref: '#/definitions/response.Response'
        "404":
          description: 老师不存在
          schema:
            $ref: '#/definitions/response.Response'
        "500":
          description: 服务器内部错误
          schema:
            $ref: '#/definitions/response.Response'
      security:
      - ApiKeyAuth: []
      summary: 绑定业务员
      tags:
      - 绑定业务员
  /dxsf/teacher/bind/salesman/list:
    get:
      description: 分页查询指定老师已绑定的业务员（id/用户名/昵称/部门/绑定时间）；data 回显 pageIndex/pageSize
      parameters:
      - description: 老师 ID
        in: query
        name: id
        required: true
        type: integer
      - description: 页码（默认 1）
        in: query
        name: page_index
        type: integer
      - description: 页大小（默认 5，上限 100）
        in: query
        name: page_size
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/model.TeacherSalesListResp'
        "400":
          description: id 缺失或非法
          schema:
            $ref: '#/definitions/response.Response'
        "500":
          description: 服务器内部错误
          schema:
            $ref: '#/definitions/response.Response'
      security:
      - ApiKeyAuth: []
      summary: 老师绑定业务员列表
      tags:
      - 绑定业务员
  /dxsf/teacher/bind/salesman/users:
    get:
      description: 返回全部已绑定业务员 userId（去重平铺数组），供人员树过滤已绑定人员
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/model.TeacherBoundResp'
        "500":
          description: 服务器内部错误
          schema:
            $ref: '#/definitions/response.Response'
      security:
      - ApiKeyAuth: []
      summary: 全量已绑定业务员
      tags:
      - 绑定业务员
  /dxsf/teacher/detail:
    get:
      description: 编辑弹窗回显（昵称/头衔/评级/头像/签名；列 rating/signature 映射接口 level/sign）
      parameters:
      - description: 老师 ID
        in: query
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/model.TeacherDetailResp'
        "400":
          description: id 缺失或非法
          schema:
            $ref: '#/definitions/response.Response'
        "404":
          description: 老师不存在
          schema:
            $ref: '#/definitions/response.Response'
        "500":
          description: 服务器内部错误
          schema:
            $ref: '#/definitions/response.Response'
      security:
      - ApiKeyAuth: []
      summary: 老师详情
      tags:
      - 老师管理
  /dxsf/teacher/edit:
    post:
      consumes:
      - application/json
      description: 编辑头衔/评级/头像/签名（仅这 4 个字段可改，冗余快照字段一律忽略；level 0 无 / 3 初级 / 5 高级）
      parameters:
      - description: 编辑老师请求体
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/model.TeacherUpdateReq'
      produces:
      - application/json
      responses:
        "200":
          description: msg 固定「编辑成功」，data 恒为 null
          schema:
            $ref: '#/definitions/model.ActionResp'
        "400":
          description: 请求体非法 / level 非 0/3/5 / 签名超过 200 字符
          schema:
            $ref: '#/definitions/response.Response'
        "404":
          description: 老师不存在
          schema:
            $ref: '#/definitions/response.Response'
        "500":
          description: 服务器内部错误
          schema:
            $ref: '#/definitions/response.Response'
      security:
      - ApiKeyAuth: []
      summary: 编辑老师
      tags:
      - 老师管理
  /dxsf/teacher/list:
    post:
      consumes:
      - application/json
      description: 分页查询老师（筛选条件走 JSON body），未传/null 字段不参与过滤；姓名/账号/昵称/头衔/操作人模糊匹配，部门/ID/认证/状态精确匹配
      parameters:
      - description: 查询条件（数值字段传 null 表示未填）
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/model.TeacherListReq'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/model.TeacherListResp'
        "400":
          description: 请求体非法
          schema:
            $ref: '#/definitions/response.Response'
        "500":
          description: 服务器内部错误
          schema:
            $ref: '#/definitions/response.Response'
      security:
      - ApiKeyAuth: []
      summary: 老师列表
      tags:
      - 老师管理
  /dxsf/teacher/options:
    get:
      description: 全量老师选项（含停用，离职转移弹窗用）
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/model.TeacherOptionsResp'
        "500":
          description: 服务器内部错误
          schema:
            $ref: '#/definitions/response.Response'
      security:
      - ApiKeyAuth: []
      summary: 老师下拉选项
      tags:
      - 老师管理
  /dxsf/teacher/resign/add:
    post:
      consumes:
      - application/json
      description: 原老师绑定业务员全部转移给接替老师（去重合并），姓名/部门等冗余快照由后端回查，group_count 按原老师绑定数计算；原老师无绑定业务员时
        400
      parameters:
      - description: 新增离职转移请求体
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/model.ResignAddReq'
      produces:
      - application/json
      responses:
        "200":
          description: msg 固定「转移成功」，data 恒为 null
          schema:
            $ref: '#/definitions/model.ActionResp'
        "400":
          description: 请求体非法 / 原老师与接替老师相同 / 转移内容超过 200 字符 / 原老师无绑定业务员
          schema:
            $ref: '#/definitions/response.Response'
        "404":
          description: 老师不存在
          schema:
            $ref: '#/definitions/response.Response'
        "500":
          description: 服务器内部错误
          schema:
            $ref: '#/definitions/response.Response'
      security:
      - ApiKeyAuth: []
      summary: 新增离职转移
      tags:
      - 离职转移
  /dxsf/teacher/resign/list:
    post:
      consumes:
      - application/json
      description: 分页查询离职转移记录（筛选条件走 JSON body，姓名类为模糊匹配，dept_id 精确匹配原老师部门快照，空值表示未填）
      parameters:
      - description: 查询条件（姓名类模糊匹配，dept_id 精确，传空串/null 表示未填）
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/model.ResignListReq'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/model.ResignListResp'
        "400":
          description: 请求体非法
          schema:
            $ref: '#/definitions/response.Response'
        "500":
          description: 服务器内部错误
          schema:
            $ref: '#/definitions/response.Response'
      security:
      - ApiKeyAuth: []
      summary: 离职转移列表
      tags:
      - 离职转移
  /getinfo:
    get:
      description: 返回角色/昵称等（gyz-admin 动态路由依赖 roles 非空）。需登录态
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/model.GetInfoResp'
        "401":
          description: 登录已过期，请重新登录
          schema:
            $ref: '#/definitions/response.Response'
      security:
      - ApiKeyAuth: []
      summary: 当前用户信息
      tags:
      - 鉴权
  /login:
    post:
      consumes:
      - application/json
      description: 账号密码登录，签发 Bearer token（Redis 白名单单设备模式：重新登录即互踢旧设备）。phone_code/uuid
        等多余字段忽略不校验
      parameters:
      - description: 登录凭据
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/model.LoginReq'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/model.LoginResp'
      summary: 登录
      tags:
      - 鉴权
  /logout:
    post:
      description: 删除 Redis 白名单使 token 立即失效（幂等）。需登录态
      produces:
      - application/json
      responses:
        "200":
          description: msg 为 退出成功
          schema:
            $ref: '#/definitions/model.ActionResp'
        "401":
          description: 登录已过期，请重新登录
          schema:
            $ref: '#/definitions/response.Response'
        "500":
          description: 服务器内部错误
          schema:
            $ref: '#/definitions/response.Response'
      security:
      - ApiKeyAuth: []
      summary: 退出登录
      tags:
      - 鉴权
schemes:
- http
securityDefinitions:
  ApiKeyAuth:
    description: 值格式：Bearer {token}，登录接口签发
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
