info:
  contact: {}
  description: |-
    chatSys（老师管理/绑定业务员/离职转移）+ 诊股记录接口。
    统一响应结构 {code, msg, data}；写操作 msg 为约定中文，查询类为 "success"。
    业务接口需 Bearer token（JWT + Redis 白名单，见 PLAN-auth.md）。
  title: im系统诊股 API
  version: "1.0"
paths:
  /admin/user/add:
    post:
      consumes:
      - application/json
      description: 新增登录账号（仅用户名+密码；密码 bcrypt 哈希落库，nickname 取 username 兜底，role 固定 admin）
      parameters:
      - description: 新增用户请求体
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/model.AdminUserAddReq'
      produces:
      - application/json
      responses:
        "200":
          description: msg 固定「新增成功」，data 恒为 null
          schema:
            $ref: '#/definitions/model.ActionResp'
        "400":
          description: 请求体非法 / 用户名已存在
          schema:
            $ref: '#/definitions/response.Response'
        "500":
          description: 服务器内部错误
          schema:
            $ref: '#/definitions/response.Response'
      security:
      - ApiKeyAuth: []
      summary: 新增用户
      tags:
      - 用户管理
  /admin/user/delete:
    post:
      consumes:
      - application/json
      description: 删除登录账号并立即踢下线（DEL Redis 白名单，该账号当前 token 立即失效）；不能删除当前登录账号
      parameters:
      - description: 删除用户请求体
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/model.AdminUserDeleteReq'
      produces:
      - application/json
      responses:
        "200":
          description: msg 固定「删除成功」，data 恒为 null
          schema:
            $ref: '#/definitions/model.ActionResp'
        "400":
          description: 请求体非法 / 不能删除当前登录账号
          schema:
            $ref: '#/definitions/response.Response'
        "404":
          description: 用户不存在
          schema:
            $ref: '#/definitions/response.Response'
        "500":
          description: 服务器内部错误
          schema:
            $ref: '#/definitions/response.Response'
      security:
      - ApiKeyAuth: []
      summary: 删除用户
      tags:
      - 用户管理
  /admin/user/edit:
    post:
      consumes:
      - application/json
      description: 编辑登录账号（password 传空串表示不修改密码；改密码且目标非操作者本人时，目标账号立即被踢下线）
      parameters:
      - description: 编辑用户请求体
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/model.AdminUserEditReq'
      produces:
      - application/json
      responses:
        "200":
          description: msg 固定「编辑成功」，data 恒为 null
          schema:
            $ref: '#/definitions/model.ActionResp'
        "400":
          description: 请求体非法 / 用户名已存在
          schema:
            $ref: '#/definitions/response.Response'
        "404":
          description: 用户不存在
          schema:
            $ref: '#/definitions/response.Response'
        "500":
          description: 服务器内部错误
          schema:
            $ref: '#/definitions/response.Response'
      security:
      - ApiKeyAuth: []
      summary: 编辑用户
      tags:
      - 用户管理
  /admin/user/list:
    post:
