info:
  contact: {}
  description: |-
    chatSys（老师管理/绑定业务员/离职转移）+ 诊股记录接口。
    统一响应结构 {code, msg, data}；写操作 msg 为约定中文，查询类为 "success"。
    业务接口需 Bearer token（JWT + Redis 白名单，见 PLAN-auth.md）。
